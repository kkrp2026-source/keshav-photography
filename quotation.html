<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Quotation | Keshav Photography</title>
    <meta name="description" content="Your personalized photography quotation from Keshav Photography.">
    <link rel="icon" href="images/logo.webp">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F4E5A3;
            --dark: #0a0a0a;
            --dark-card: #141414;
            --gray: #888;
            --gray-light: #b5b5b5;
            --line: rgba(212,175,55,0.18);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { max-width: 100%; overflow-x: hidden; }
        body {
            font-family: 'Mulish', sans-serif;
            background: var(--dark);
            color: #eee;
            line-height: 1.6;
        }
        .q-wrap { max-width: 1000px; margin: 0 auto; padding: 0 20px 80px; width: 100%; }
        img { max-width: 100%; }
        /* Tables scroll inside their own container, not the whole page */
        .q-table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 20px; }
        .q-table-scroll table.q-table { margin-bottom: 0; }

        /* Header */
        .q-top { text-align: center; padding: 50px 0 30px; }
        .q-top img { height: 90px; margin-bottom: 20px; }
        .q-title { font-family: 'Cinzel', serif; font-size: 2.4rem; letter-spacing: 6px; color: var(--gold); }
        .q-title span { color: #fff; }
        .q-title-mark { display: inline-flex; gap: 6px; margin-left: 10px; vertical-align: middle; }
        .q-title-mark i { width: 14px; height: 14px; display: inline-block; }
        .q-title-mark .m1 { background: #666; }
        .q-title-mark .m2 { background: var(--gold); }
        .q-proposal { text-align: right; margin-top: 20px; color: var(--gray-light); font-size: 0.9rem; }
        .q-proposal b { color: var(--gold); }

        /* Hero image */
        .q-hero-img { width: 100%; height: auto; object-fit: contain; display: block; margin: 30px auto; border: 1px solid var(--line); }
        .q-happily { text-align: center; margin: 30px 0 50px; }
        .q-happily h2 { font-family: 'Cinzel', serif; font-size: 2rem; letter-spacing: 8px; color: #fff; line-height: 1.4; }
        .q-happily .sub { color: var(--gold); letter-spacing: 3px; font-size: 0.8rem; margin: 12px 0; text-transform: uppercase; }
        .q-happily p { color: var(--gray-light); font-size: 0.85rem; letter-spacing: 1px; }

        /* Achievements */
        .q-awards { border: 1px solid var(--gold); padding: 40px; margin: 40px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 30px; justify-items: center; }
        .q-award { text-align: center; }
        .q-award .num { font-family: 'Cinzel', serif; font-size: 2.2rem; color: var(--gold); line-height: 1; }
        .q-award .lbl { background: var(--gold); color: var(--dark); font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; padding: 4px 14px; margin-top: 10px; display: inline-block; font-weight: 700; }

        /* Showcase images */
        .q-showcase { border: 1px solid var(--gold); padding: 25px; margin: 40px 0; display: grid; gap: 25px; }
        .q-showcase .shot { position: relative; text-align: center; }
        .q-showcase .shot img { width: 100%; height: auto; object-fit: contain; display: block; background: #000; }
        .q-showcase .shot .cap { display: inline-block; margin-top: -2px; background: var(--gold); color: var(--dark); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; padding: 6px 30px; font-weight: 700; }
        .q-showcase .shot .cap-link { text-decoration: none; cursor: pointer; transition: background 0.25s, transform 0.2s; }
        .q-showcase .shot .cap-link:hover { background: var(--gold-light); transform: translateY(-1px); }
        .q-showcase .shot .cap-link i { margin-right: 7px; }

        /* Client details table */
        .q-section-title { text-align: center; font-family: 'Cinzel', serif; letter-spacing: 5px; color: var(--gold); font-size: 1.5rem; margin: 55px 0 30px; text-transform: uppercase; }
        table.q-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        table.q-table th, table.q-table td { padding: 11px 15px; text-align: left; font-size: 0.85rem; border: 1px solid #2a2a2a; }
        table.q-table .k { background: var(--gold); color: var(--dark); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; width: 180px; }
        table.q-table .hd { background: var(--gold); color: var(--dark); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        table.q-table td.v { color: #ddd; }

        .q-client-box { max-width: 520px; margin: 0 auto 50px; }

        /* Event block */
        .q-event-badge { border: 2px solid var(--gold); display: inline-block; padding: 14px 26px; text-align: center; margin: 40px 0 18px; }
        .q-event-badge .t { font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 3px; color: var(--gray-light); }
        .q-event-badge .n { font-family: 'Cinzel', serif; font-size: 1.8rem; color: #fff; }

        /* Deliverables + pricing */
        .q-pricing { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 40px; }
        .q-price-box { border: 1px solid var(--gold); padding: 30px; }
        .q-price-box .row { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 12px; letter-spacing: 1px; }
        .q-price-box .row .lab { color: var(--gray-light); text-transform: uppercase; font-size: 0.8rem; }
        .q-price-box .row .amt { color: var(--gold); font-weight: 700; }
        .q-price-box.valid { text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .q-price-box.valid h4 { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 2px; margin-bottom: 10px; }

        /* Gallery CTA */
        .q-gallery-cta { text-align: center; margin: 55px 0 10px; }
        .q-gallery-cta p { color: var(--gray-light); font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 16px; text-transform: uppercase; }
        .q-gallery-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--gold); color: var(--dark); font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; padding: 14px 34px; border-radius: 4px; text-decoration: none; transition: all 0.25s; }
        .q-gallery-btn:hover { background: var(--gold-light); transform: translateY(-2px); }

        /* Thank you */
        .q-thanks { text-align: center; margin: 70px 0 30px; }
        .q-thanks p { max-width: 640px; margin: 0 auto 30px; color: var(--gray-light); font-size: 0.85rem; }
        .q-thanks h1 { font-family: 'Cinzel', serif; font-size: 4rem; letter-spacing: 20px; color: var(--gold); }
        .q-footer-strip { text-align: center; color: var(--gray); font-size: 0.8rem; letter-spacing: 4px; margin-top: 40px; border-top: 1px solid var(--line); padding-top: 25px; }
        .q-footer-strip .site { color: var(--gold); letter-spacing: 6px; font-size: 1rem; margin-top: 10px; }

        .q-error { text-align: center; padding: 120px 20px; }
        .q-error i { font-size: 3rem; color: var(--gold); margin-bottom: 20px; }
        .q-error h2 { font-family: 'Cinzel', serif; letter-spacing: 3px; margin-bottom: 10px; }
        .q-error p { color: var(--gray-light); }
        .q-error a { color: var(--gold); }

        .q-print { position: fixed; bottom: 24px; right: 24px; background: var(--gold); color: var(--dark); border: none; width: 54px; height: 54px; border-radius: 50%; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.4); z-index: 50; display: flex; align-items: center; justify-content: center; }

        @media (max-width: 700px) {
            .q-wrap { padding: 0 14px 60px; }
            .q-title { font-size: 1.4rem; letter-spacing: 2px; }
            .q-title-mark { margin-left: 6px; }
            .q-happily h2 { font-size: 1.3rem; letter-spacing: 3px; }
            .q-thanks h1 { font-size: 1.9rem; letter-spacing: 6px; }
            .q-section-title { font-size: 1.2rem; letter-spacing: 3px; }
            .q-pricing { grid-template-columns: 1fr; }
            table.q-table .k { width: 120px; }
            .q-proposal { text-align: center; }
            .q-awards { padding: 25px 15px; gap: 20px; }
            .q-footer-strip .site { letter-spacing: 3px; font-size: 0.85rem; word-break: break-word; }
        }
        @media print {
            body { background: #fff; color: #000; }
            .q-print, .q-gallery-cta { display: none; }
            .q-table td.v, .q-happily h2, .q-award .num { color: #000 !important; }
        }
    </style>
</head>
<body>
    <div id="quotationRoot" class="q-wrap"></div>
    <button class="q-print" id="printBtn" title="Save as PDF / Print" aria-label="Save as PDF or Print" style="display:none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
    </button>
    <script src="js/quotation-view.js?v=20261017"></script>
</body>
</html>
